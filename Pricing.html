<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Synthetic pricing page for Contoso WorkHub, a fictional collaboration platform.">
  <title>Pricing | Contoso WorkHub</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --background: #f8fafc;
      --surface: #ffffff;
      --text: #172033;
      --muted: #5f6b7a;
      --border: #dbe3ee;
      --warning-bg: #fff4d6;
      --warning-text: #704d00;
      --warning-border: #f2c94c;
      --business-bg: #eff6ff;
      --business-border: #60a5fa;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      --shadow-highlighted: 0 22px 55px rgba(37, 99, 235, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--background);
      line-height: 1.6;
    }

    .warning {
      padding: 12px 20px;
      color: var(--warning-text);
      background: var(--warning-bg);
      border-bottom: 1px solid var(--warning-border);
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .navbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      font-size: 1.15rem;
      font-weight: 800;
      text-decoration: none;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: inline-grid;
      place-items: center;
      border-radius: 10px;
      color: #ffffff;
      background: var(--primary);
      font-size: 1rem;
      letter-spacing: -0.04em;
    }

    .home-link {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 8px;
      color: var(--primary-dark);
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
    }

    .home-link:hover,
    .home-link:focus-visible {
      background: #eff6ff;
      outline: none;
    }

    .page-heading {
      padding: 72px 0 46px;
      text-align: center;
      background: linear-gradient
